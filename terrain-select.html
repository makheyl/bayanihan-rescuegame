<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Choose Habitat — Terraqua Clash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .terrain-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(min(330px,100%),1fr));
    gap:clamp(.8rem,1.8vw,1.3rem);
  }
  .tcard__art{
    position:relative; aspect-ratio:16/9;
    border-bottom:4px solid var(--ink);
    background:var(--sea-deep);
    overflow:hidden;
  }
  .tcard__art canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .tcard__tide{
    position:absolute; right:.5rem; bottom:.5rem; z-index:2;
    font-size:.62rem; font-weight:900; text-transform:uppercase; letter-spacing:.04em;
    padding:.3em .7em; border-radius:var(--r-pill);
    background:rgba(20,49,63,.82); color:#fff; border:2.5px solid rgba(255,255,255,.7);
  }
  /* land / water split at mid tide — the label sits outside the bar so a
     small land share can never squeeze its own text away */
  .tcard__split{
    position:absolute; left:.5rem; bottom:.5rem; z-index:2;
    display:flex; align-items:center; gap:.4rem;
    padding:.2rem .55rem .2rem .3rem;
    border-radius:var(--r-pill);
    border:2.5px solid var(--ink);
    background:rgba(20,49,63,.82);
    font-size:.62rem; font-weight:900; color:#fff; white-space:nowrap;
  }
  .tcard__bar{
    display:flex; width:4.2rem; height:.7rem; flex:none;
    border-radius:var(--r-pill); overflow:hidden;
    border:2px solid rgba(255,255,255,.75);
  }
  .tcard__bar span{ display:block; height:100%; }
  .tcard__fact{
    font-size:.74rem; font-weight:700; line-height:1.4;
    color:#4a6472; border-left:5px solid var(--blue-2);
    padding-left:.6rem; margin-top:.15rem;
  }
  .lineup{
    display:flex; gap:.5rem; flex-wrap:wrap; align-items:center;
    padding:.6rem .9rem; margin-bottom:clamp(.9rem,2vw,1.3rem);
    border-radius:var(--r-lg); border:4px solid var(--ink);
    background:rgba(255,255,255,.9);
    box-shadow:0 6px 0 rgba(20,49,63,.45);
  }
  .lineup__label{
    font-family:var(--font-display); font-weight:800; font-size:.9rem;
    color:var(--ink); margin-right:.3rem;
  }
  .lineup__slot{ display:flex; align-items:center; gap:.4rem; }
  .lineup__slot canvas{
    width:clamp(34px,4vw,46px); height:clamp(34px,4vw,46px);
    border-radius:50%; border:3px solid var(--ink);
    background:linear-gradient(180deg,var(--sky-2),var(--sea));
  }
  .lineup__name{ font-size:.76rem; font-weight:900; color:var(--ink); }
  .lineup__cls{ font-size:.66rem; font-weight:800; color:var(--ink-soft); opacity:.8; }
</style>
</head>
<body>

<div class="page">
  <header class="topbar">
    <div class="topbar__logo" role="img" aria-label="Terraqua Clash"></div>
    <div>
      <div class="topbar__title outlined">Choose Habitat</div>
      <div class="topbar__sub">Each map starts with a different land–water split and runs its own tide cycle</div>
    </div>
    <button class="tq-btn tq-btn--ghost tq-btn--sm" type="button" id="btnBack">← Menu</button>
  </header>

  <div class="page__body">
    <div class="lineup" id="lineup" aria-label="Match line-up"></div>
    <div class="terrain-grid" id="terrains"></div>
  </div>

  <footer class="page__footer">
    <div class="footer__hint" id="pickHint">Pick a habitat to load the arena.</div>
    <div style="display:flex; gap:.6rem; flex-wrap:wrap">
      <button class="tq-btn tq-btn--ghost" type="button" id="btnChars">Change Animals</button>
      <button class="tq-btn tq-btn--green" type="button" id="btnStart" disabled>Start Match →</button>
    </div>
  </footer>
</div>

<script src="js/core.js"></script>
<script src="js/animals.js"></script>
<script src="js/terrains.js"></script>
<script src="js/powerups.js"></script>
<script src="js/terrain-select.js"></script>
</body>
</html>
