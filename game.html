<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Arena — Terraqua Clash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>

<div class="game-shell">

  <!-- ------------------------------------------------------- top HUD -->
  <header class="game-top">
    <div class="game-terrain">
      <button class="icon-btn" type="button" id="btnPause" aria-label="Pause">⏸</button>
      <div class="game-terrain__sdg" id="hudSdg"></div>
      <div class="game-terrain__name" id="hudTerrain">—</div>
    </div>

    <div class="timer-box">
      <div class="timer" id="hudTimer">1:30</div>
      <div class="timer-label" id="hudAlive">4 alive</div>
    </div>

    <div class="tide-gauge">
      <div class="tide-gauge__label" id="hudTideLabel">Sea level</div>
      <div class="tide-gauge__track">
        <div class="tide-gauge__marker" id="hudTideMarker" style="left:50%"></div>
      </div>
      <div class="tide-gauge__arrow" id="hudTideArrow" aria-hidden="true">▲</div>
    </div>
  </header>

  <!-- --------------------------------------------------------- arena -->
  <div class="arena-wrap">
    <div class="arena-stage" id="stage">
      <canvas id="arena" aria-label="Match arena"></canvas>

      <div class="banner" id="banner" role="status">
        <div class="banner__title" id="bannerTitle"></div>
        <div class="banner__sub" id="bannerSub"></div>
      </div>

      <!-- countdown -->
      <div class="overlay" id="ovCountdown">
        <div>
          <div class="countdown" id="countdownNum">3</div>
          <div class="countdown-sub" id="countdownSub"></div>
        </div>
      </div>

      <!-- pause -->
      <div class="overlay" id="ovPause">
        <div class="panel">
          <div class="panel__head"><div class="panel__title">Paused</div></div>
          <div class="panel__body">
            <p>The tide waits for nobody — but it will wait for you.</p>
            <div class="pause-keys">
              <div><span>Resume</span><span><span class="kbd">P</span> / <span class="kbd">Esc</span></span></div>
              <div><span>Restart round</span><span><span class="kbd">R</span></span></div>
              <div><span>Mute</span><span><span class="kbd">M</span></span></div>
            </div>
          </div>
          <div class="panel__foot">
            <button class="tq-btn tq-btn--ghost" type="button" id="pauseQuit">Main Menu</button>
            <button class="tq-btn tq-btn--ghost" type="button" id="pauseRestart">Restart</button>
            <button class="tq-btn tq-btn--green" type="button" id="pauseResume">Resume</button>
          </div>
        </div>
      </div>

      <!-- results -->
      <div class="overlay" id="ovResults">
        <div class="panel">
          <div class="panel__head panel__head--win"><div class="panel__title" id="resultTitle">Round over</div></div>
          <div class="panel__body">
            <ol class="results" id="resultList"></ol>
            <div id="resultFact"></div>
          </div>
          <div class="panel__foot">
            <button class="tq-btn tq-btn--ghost" type="button" id="resMenu">Main Menu</button>
            <button class="tq-btn tq-btn--ghost" type="button" id="resTerrain">Change Habitat</button>
            <button class="tq-btn tq-btn--green" type="button" id="resAgain">Play Again</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ---------------------------------------------------- player strip -->
  <div class="game-bottom" id="pstrip"></div>
</div>

<script src="js/core.js"></script>
<script src="js/animals.js"></script>
<script src="js/terrains.js"></script>
<script src="js/powerups.js"></script>
<script src="js/game.js"></script>
</body>
</html>
